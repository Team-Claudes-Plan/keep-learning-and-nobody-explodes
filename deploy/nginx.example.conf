# Example nginx reverse proxy on the host in front of `docker compose up`
# (the frontend container listens on 127.0.0.1:8080, see docker-compose.yml).
#
#   sudo cp deploy/nginx.example.conf /etc/nginx/conf.d/keep-learning.conf
#   # adjust server_name, then: sudo nginx -t && sudo systemctl reload nginx
#   # optional TLS: sudo certbot --nginx -d learn.example.org

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name learn.example.org;

    # Uploads of large scanned PDFs (the backend accepts up to 256 MiB).
    client_max_body_size 256m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Websockets of the game sessions and the user channel
        # (/backend/api/sessions/ws, /backend/api/users/ws).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }
}
