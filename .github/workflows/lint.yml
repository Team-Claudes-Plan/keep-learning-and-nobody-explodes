name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-rust:
    name: lint-rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cmd-format: "nix develop -c {0}"
          cache-bin: false
          cache-on-failure: true

      - name: Check formatting
        run: nix develop --no-update-lock-file --command cargo fmt --all --check

      - name: Run clippy
        run: nix develop --no-update-lock-file --command cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
