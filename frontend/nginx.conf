# nginx inside the frontend image (see Dockerfile and ../docker-compose.yml).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Single-page app: unknown paths are client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build output never changes under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Only RustFS (inside the compose network) may deliver upload events.
    location /backend/events/ {
        return 404;
    }

    # REST API, uploads and the websockets (/backend/api/sessions/ws, /backend/api/users/ws).
    location /backend/ {
        proxy_pass http://backend:8081/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads of large scanned PDFs (the backend accepts up to 256 MiB).
        client_max_body_size 256m;
        proxy_request_buffering off;

        # Game sessions keep their websocket open for a long time.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
